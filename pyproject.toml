[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-portrait"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "torch>=2.1",
    "scikit-learn>=1.8",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "sentence-transformers>=2.2",
    "tqdm>=4.66",
]

[tool.setuptools]
packages = ["rna_portrait"]
